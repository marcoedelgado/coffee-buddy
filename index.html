<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whose round? · Coffee Buddy</title>
  <meta name="description" content="Who bought the last coffee? Keeps score so you don't have to.">

  <!-- Home-screen app (iPhone: Safari → Share → Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coffee">
  <meta name="theme-color" content="#FFF7E8">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="cb">
    <header class="cb-head">
      <div class="cb-head-text">
        <div class="cb-chip">Coffee tracker</div>
        <h1 class="cb-title">Whose<br>round?</h1>
      </div>
      <div class="cb-mascot">
        <div class="cb-rawr" aria-hidden="true">RAWR!</div>
        <img class="cb-dragon" src="assets/dragon.png" alt="Rawr dragon" width="140" height="131">
      </div>
    </header>

    <p class="cb-hint" id="hint">Tap a buddy, then tap who’s buying.</p>

    <ul class="cb-list" id="list"></ul>

    <div class="cb-empty" id="empty" hidden>
      <img src="assets/cup.png" alt="" width="120" height="120">
      No coffee buddies yet. Add one below.
    </div>
  </main>

  <div class="cb-dock">
    <div class="cb-toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button class="cb-toast-undo" id="toast-undo" type="button">Undo</button>
    </div>
    <p class="cb-error" id="add-error" role="alert"></p>
    <form class="cb-add" id="add-form" autocomplete="off">
      <label class="cb-sr" for="add-name">Add a person</label>
      <input class="cb-input" id="add-name" name="name" type="text" placeholder="Add a coffee buddy…"
             maxlength="40" autocapitalize="words" enterkeyhint="done">
      <button class="cb-btn-add" type="submit" aria-label="Add person">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
  </div>

  <template id="card-tpl">
    <li class="cb-card">
      <button class="cb-card-head" type="button" aria-expanded="false">
        <span class="cb-avatar" aria-hidden="true"></span>
        <span class="cb-card-text">
          <span class="cb-name"></span>
          <span class="cb-last"></span>
        </span>
        <span class="cb-pill"></span>
      </button>
      <div class="cb-panel" hidden>
        <div class="cb-panel-title">
          <img src="assets/cup.png" alt="" width="34" height="34">
          <span>Who’s buying now?</span>
        </div>
        <div class="cb-pay">
          <button class="cb-pay-btn" type="button" data-payer="me">
            <span class="cb-pay-who">Me</span>
            <span class="cb-pay-count"></span>
          </button>
          <button class="cb-pay-btn" type="button" data-payer="them">
            <span class="cb-pay-who"></span>
            <span class="cb-pay-count"></span>
          </button>
        </div>
        <div class="cb-panel-foot">
          <button class="cb-link" type="button" data-action="undo">Undo last</button>
          <button class="cb-link cb-link-danger" type="button" data-action="remove"></button>
        </div>
      </div>
    </li>
  </template>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
